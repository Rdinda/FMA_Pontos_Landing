services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-app
    environment:
      - FPM_PORT=9000
    restart: unless-stopped
    networks:
      - landing-net
    volumes:
      - storage:/var/www/html/storage

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-nginx
    environment:
      - NGINX_PORT=80
      - PHP_FPM_HOST=app
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - landing-net
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing.rule=Host(${TRAEFIK_DOMAIN})"
      - "traefik.http.routers.landing.entrypoints=websecure"
      - "traefik.http.routers.landing.tls=true"
      - "traefik.http.routers.landing.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing-http.rule=Host(${TRAEFIK_DOMAIN})"
      - "traefik.http.routers.landing-http.entrypoints=web"
      - "traefik.http.routers.landing-http.middlewares=redirecthttps"
      - "traefik.http.middlewares.redirecthttps.redirectscheme.scheme=https"
      - "traefik.http.services.landing.loadbalancer.server.port=80"

  supervisor:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-supervisor
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - landing-net
    volumes:
      - storage:/var/www/html/storage

networks:
  landing-net:
    driver: bridge
  dokploy-network:
    external: true
    name: dokploy-network

volumes:
  storage:
    driver: local
 

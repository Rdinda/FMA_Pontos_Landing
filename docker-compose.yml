services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-app
    environment:
      - FPM_PORT=9000
    restart: unless-stopped
    networks:
      - landing-net
    volumes:
      - storage:/var/www/html/storage

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-nginx
    environment:
      - NGINX_PORT=80
      - PHP_FPM_HOST=app
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - landing-net
      - landing-proxy-network

  supervisor:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-supervisor
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - landing-net
    volumes:
      - storage:/var/www/html/storage

networks:
  landing-net:
    driver: bridge
  landing-proxy-network:
    external: true
    name: landing-proxy-network

volumes:
  storage:
    driver: local
 
